name: Pull Request Validation

on:
  pull_request:
    branches: [master]

jobs:
  # Job 1: Lintowanie kodu
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint

  # Job 2: Testy jednostkowe (równolegle z e2e)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests with coverage
        run: npm run test:coverage
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  # Job 3: Testy E2E (równolegle z unit-tests)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint]
    environment: integration
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      
      - name: Run E2E tests
        run: npm run e2e
        env:
          CI: true
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  # Job 4: Komentarz z podsumowaniem statusu
  status-comment:
    name: PR Status Comment
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests]
    if: ${{ always() && needs.lint.result == 'success' && needs.unit-tests.result == 'success' && needs.e2e-tests.result == 'success' }}
    permissions:
      pull-requests: write
    
    steps:
      - name: Check job statuses
        id: check-status
        run: |
          lint_status="${{ needs.lint.result }}"
          unit_status="${{ needs.unit-tests.result }}"
          e2e_status="${{ needs.e2e-tests.result }}"
          
          echo "lint_status=$lint_status" >> $GITHUB_OUTPUT
          echo "unit_status=$unit_status" >> $GITHUB_OUTPUT
          echo "e2e_status=$e2e_status" >> $GITHUB_OUTPUT
          
          if [ "$lint_status" = "success" ] && [ "$unit_status" = "success" ] && [ "$e2e_status" = "success" ]; then
            echo "overall_status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "overall_status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi
      
      - name: Create status comment
        uses: actions/github-script@v7
        with:
          script: |
            const emoji = '${{ steps.check-status.outputs.emoji }}';
            const overallStatus = '${{ steps.check-status.outputs.overall_status }}';
            const lintStatus = '${{ needs.lint.result }}';
            const unitStatus = '${{ needs.unit-tests.result }}';
            const e2eStatus = '${{ needs.e2e-tests.result }}';
            
            const statusEmoji = (status) => {
              if (status === 'success') return '✅';
              if (status === 'failure') return '❌';
              if (status === 'cancelled') return '⚠️';
              return '⏭️';
            };
            
            const commentBody = `## ${emoji} Pull Request Validation Results
            
            | Job | Status |
            |-----|--------|
            | Linting | ${statusEmoji(lintStatus)} ${lintStatus} |
            | Unit Tests | ${statusEmoji(unitStatus)} ${unitStatus} |
            | E2E Tests | ${statusEmoji(e2eStatus)} ${e2eStatus} |
            
            **Overall Status**: ${overallStatus === 'success' ? '✅ All checks passed!' : '❌ Some checks failed'}
            
            ---
            <sub>Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

